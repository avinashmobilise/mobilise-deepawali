# Render Blueprint: free web service.
# Votes are kept in a free Upstash Redis database because Render's free disk is wiped on restart.
services:
  - type: web
    name: mobilise-diwali-utsav
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/state
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
